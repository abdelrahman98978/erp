name: Build Native Android APK & iOS IPA (Alsulaim ERP Mobile)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
      - name: Build Release APK
        run: flutter build apk --release
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsulaim-erp-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (Unsigned for SideLoad / AltStore / Enterprise Sign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign
      - name: Package Runner.app into AlsulaimERP-iOS.ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r AlsulaimERP-iOS.ipa Payload
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsulaim-erp-ios-ipa
          path: mobile_app/build/ios/iphoneos/AlsulaimERP-iOS.ipa
