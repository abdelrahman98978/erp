        <script type="text/javascript">
        $(function() {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');

            if (passwordInput && passwordToggle) {
                const eyeIcon = passwordToggle.querySelector('i');
                const showLabel = "\u0625\u0638\u0647\u0627\u0631 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631";
                const hideLabel = "\u0625\u062e\u0641\u0627\u0621 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631";

                passwordToggle.addEventListener('click', function() {
                    const isHidden = passwordInput.type === 'password';

                    passwordInput.type = isHidden ? 'text' : 'password';
                    passwordToggle.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
                    passwordToggle.setAttribute('aria-label', isHidden ? hideLabel : showLabel);

                    if (eyeIcon) {
                        eyeIcon.className = isHidden ? 'fa fa-eye-slash' : 'fa fa-eye';
                    }
                });
            }

            $(document).on("submit", "#loginForm", function(e) {
                e.preventDefault();
                let formObj = $(this);
                formObj.find("[type='submit']").html("تسجيل الدخول....");
                $.ajax({
                    url: formObj.attr('action'),
                    data: formObj.serialize(),
                    type: "POST",
                    dataType: 'json',
                    success: function(result) {
                        formObj.find("[type='submit']").html("تسجيل الدخول.");
                        $('.form-alert').html(result.message)
                        if (result.code === 200) {
                            successToster('تم بنجاح', result
                            .message);
                            window.location.href = result.data.url;
                        } else if (result.code === 401) {
                            warningToster('حدث خطأ', result.message)
                        } else {
                            warningToster('حدث خطأ', result.message)
                        }
                    },
                    error: function(errorObj) {
                        formObj.find("[type='submit']").html("تسجيل الدخول.");
                        if (errorObj.status === 500) {
                            errorToster('حدث خطأ',
                                "لا تمتلك الصلاحية ");
                        } else if (errorObj.status == 422) {
                            let errorsObj = $.parseJSON(errorObj.responseText);
                            let listObject = errorsObj.errors;
                            let testArr = [];
                            $.each(listObject, function(errorKey, errorArr) {
                                $.each(errorArr, function(key, value) {
                                    testArr.push(value);
                                });
                            });
                            validToster('حدث خطأ', testArr)
                        }
                    }
                });
                return false;
            });
        });
    </script>
